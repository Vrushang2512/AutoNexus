name: AutoNexus Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  login-test:
    name: 8-Step Login Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run 8-step login test
        run: npx playwright test
        env:
          ENVIZOM_BASE_URL: ${{ secrets.ENVIZOM_BASE_URL }}
          ENVIZOM_EMAIL: ${{ secrets.ENVIZOM_EMAIL }}
          ENVIZOM_PASSWORD: ${{ secrets.ENVIZOM_PASSWORD }}

      - name: Upload devices report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devices-report
          path: playwright/test-results/devices-report.html

      - name: Upload captured APIs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captured-apis
          path: playwright/test-results/captured-apis.json

      - name: Upload overview results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-results
          path: playwright/test-results/overview-results.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
